<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bolton Live Temperature</title>
</head>

<body>
		<div class="student-info">
		<p><strong>MD MOSTAK LAHERI</strong><br>
		Student ID: <strong>2511809</strong></p>
		</div>
	<h1>Current Weather in Bolton</h1>
	
	<p id="myWeather">Please wait...</p>
	<p id="myTemperature">Please wait...</p>
	<p id="myLastUpdated">Please wait...</p>
	<script>
	
	// Fetch weather data from API for given city
	fetch('https://mi-linux.wlv.ac.uk/~2511809/my-api.php?city=Bolton')
		
	  // Convert response string to json object
	  .then(response => response.json())
	  .then(response => {

		// Copy one element of response to our HTML paragraph
		document.getElementById("myWeather").innerHTML = response.weather_description;
		document.getElementById("myTemperature").innerHTML = 'Temperature:' + response.weather_temperature + '°';
		document.getElementById("myLastUpdated").innerHTML = 'Last updated: ' + response.weather_when;
		
		// Save new data to browser, with new timestamp
		localStorage.myWeather = response.weather_description;
		localStorage.myTemperature = response.weather_temperature + '°';
		localStorage.when = Date.now(); // milliseconds since January 1 1970
		
		
	  })
	  .catch(err => {
		
		// Display errors in console
		console.log(err);
	});

	</script>
	
<style>

  body {
      background-image: url('https://www.pixelstalk.net/wp-content/uploads/2016/07/Weather-Image-Download-Free.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color:white;
      text-align: center;
      font-family: Arial, sans-serif;
      margin-top: 100px;
    }

    h1 {
      font-size: 1.5cm;
      margin-bottom: 20px;
    }
	
	.student-info {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: rgba(0, 0, 0, 0);
      padding: 10px 15px;
      border-radius: 8px;
      text-align: left;
      font-size: 18px;
    }

  </style>
</body>
</html>
